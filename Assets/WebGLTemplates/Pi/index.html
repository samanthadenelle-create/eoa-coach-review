<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>{{{ PRODUCT_NAME }}}</title>

    <!-- Pi Network SDK. Provides window.Pi (only resolves inside Pi Browser).
         Pi.init + Pi.authenticate are driven from C# via PiBridge.jslib /
         PiSignInController — we only LOAD the SDK here so window.Pi exists. -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0d0a14; }
      #unity-container { position: absolute; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; background: #0d0a14; display: block; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #b39ddb; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">Loading {{{ PRODUCT_NAME }}}…</div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      var loadingBar = document.querySelector("#unity-loading-bar");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(document.querySelector("#unity-canvas"), config, function (progress) {
          if (loadingBar) loadingBar.textContent = "Loading… " + Math.round(progress * 100) + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance; // SendMessage targets this
          if (loadingBar) loadingBar.style.display = "none";
        }).catch(function (message) {
          if (loadingBar) loadingBar.textContent = "Load error: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <!-- WO-1906: `viewport-fit=cover` ADDED (never swapped for the existing guards - maximum-scale
         and user-scalable=no are what stop iOS double-tap/pinch zooming the page out from under the
         game). cover lets the layout viewport reach under the notch/home indicator; the JS fit block
         at the bottom of this file then subtracts the real safe-area insets, so the HUD edges stay
         reachable instead of being hidden behind system chrome. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>{{{ PRODUCT_NAME }}}</title>

    <!-- Pi Network SDK. Provides window.Pi (only resolves inside Pi Browser).
         Pi.init + Pi.authenticate are driven from C# via PiBridge.jslib /
         PiSignInController - we only LOAD the SDK here so window.Pi exists. -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <!-- AppLixir rewarded video (itch / Vercel WebGL). Pi Browser uses PiAdProvider instead. -->
    <script src="https://cdn.applixir.com/applixir.app.v6.1.0.js"></script>

    <!-- WO-1910. A real browser build of npm buffer 6.0.3, generated from node_modules by
         tools/build-page-buffer.mjs (nothing downloaded). It provides the page global the
         Solana wallet SIGN path reads inside SolanaWalletAdapterWebGL.jslib. FIRST, because
         the wallet-adapter CDN bundle prefers the page's copy when one exists, so the page
         copy has to be the complete one. Replaces the minimal shim WO-1908 installed. -->
    <script src="page-buffer.js"></script>

    <!-- WO-1908 (amended WO-1910: it now owns `unityWebView` only - gree's WebGL plugin;
         the wallet-adapter page global moved to page-buffer.js above).
         A page global our jslibs read but nothing else on this page defines.
         LOCAL and SYNCHRONOUS, and ahead of the
         loader that this template appends from JS - a bare-identifier ReferenceError
         raised inside a jslib is not a managed exception, it aborts the runtime
         (WO-1897). See page-globals.js for the full derivation. -->
    <script src="page-globals.js"></script>

    <!-- WO-1957. The mobile-browser wallet handoff door. LOCAL, SYNCHRONOUS, and BEFORE the
         loader: EoaWalletBridge.jslib reads `window.eoaWalletHandoff` from inside a jslib, and a
         bare-identifier miss there aborts the runtime rather than raising a managed exception
         (the WO-1897 rule page-globals.js was written under). It also has to read the
         `?eoaWallet=` return marker off location.search BEFORE anything can rewrite the URL.
         It performs NO navigation on load - C# asks. See the file header for the measured RCA. -->
    <script src="wallet-handoff.js"></script>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0d0a14;
        /* The browser must NOT claim pan/pinch/scroll gestures over the game - else build-mode
           camera drag/pinch is dead on mobile web while it works in the native APK (RCA 2026-07-16). */
        touch-action: none; overscroll-behavior: none; overflow: hidden;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* WO-1906: `fixed`, not `absolute`. An absolutely-positioned 100%/100% box is sized off the
         LAYOUT viewport, which on iOS Safari and inside an itch iframe can be larger than the
         VISUAL viewport (the part the player can actually see). The JS fit block below overrides
         width/height in px from visualViewport on every resize; these values are the pre-JS
         fallback, and `left/top:0` is what the px offsets are applied against. */
      #unity-container { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
        overflow: hidden; }
      /* The safe-area probe. env() is only readable from CSS, so we park the four insets on a
         zero-size element's padding and read them back with getComputedStyle - there is no JS API
         for them. It never paints. */
      #eoa-safe-probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden;
        pointer-events: none;
        padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
        padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
      /* WO-1312: Pi Browser is a portrait-locked WebView that REFUSES orientation.lock, so we
         render the game rotated instead of asking the player to rotate. The wrapper is sized in
         px from JS (width = innerHeight, height = innerWidth) before this class is applied.
         See the derivation in the script block - the input shim below is NOT optional. */
      #unity-container.pi-rotated { position: fixed; top: 0; left: 0;
        transform-origin: top left; transform: rotate(90deg) translateY(-100%); }
      /* touch-action:none on the canvas itself is the load-bearing line: without it a mobile
         browser eats multi-finger gestures before Unity's canvas receives them. */
      #unity-canvas { width: 100%; height: 100%; background: #0d0a14; display: block;
        touch-action: none; -ms-touch-action: none; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #b39ddb; font-family: sans-serif; }
      #pi-landscape-gate { display: none; position: fixed; inset: 0; z-index: 99999;
        align-items: center; justify-content: center; flex-direction: column; gap: 18px;
        padding: 28px; box-sizing: border-box; text-align: center; color: #f4e5b5;
        background: #0d0a14; font: 600 20px/1.4 sans-serif; }
      #pi-landscape-gate button { min-width: 260px; min-height: 64px; padding: 12px 24px;
        color: #17100a; background: #d9ad38; border: 2px solid #f4d16b; border-radius: 8px;
        font: 700 18px sans-serif; }
      /* Escape hatch. Secondary by POSITION (below the primary) and by WEIGHT/SIZE, never by
         colour alone - the owner is red/green colourblind (CLAUDE.md house rule). It stays
         display:none until the bounded timeout reveals it. */
      #pi-landscape-continue { display: none; min-height: 52px; margin-top: 4px;
        color: #f4e5b5; background: transparent; border: 2px solid #6b5a2e;
        font: 600 16px sans-serif; }

      /* ---------------------------------------------------------------------------------
         WO-1927: the PRE-RUNTIME bug door. Reachable while the loader runs, i.e. BEFORE the
         Unity runtime (which owns the real feedback UI) exists at all.
         POSITION: a sibling of #unity-container, never a child. The container takes
         `transform: rotate(90deg)` on the Pi rotated surface (WO-1312) and a rotated
         textarea is unusable - so the door lives outside it and is never rotated.
         z-index clears #pi-landscape-gate (99999) so it stays tappable over the gate.
         TOUCH/SELECT OVERRIDES: `body` sets touch-action:none + user-select:none for the
         game canvas. A text field inherits both and iOS then refuses to type into it or
         scroll it, so the field re-enables exactly those two, for itself only.
         Anchored bottom-centre within the safe area so it is reachable on a phone-width
         viewport with no scrolling (acceptance 2). --------------------------------------- */
      #eoa-preruntime-door { position: fixed; z-index: 100000;
        left: 50%; transform: translateX(-50%);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
        width: min(92vw, 420px); box-sizing: border-box; text-align: center;
        font-family: sans-serif; }
      #eoa-preruntime-open { min-height: 48px; padding: 10px 20px; width: 100%;
        color: #d7c9f0; background: rgba(13, 10, 20, 0.82); border: 1px solid #4b3c6b;
        border-radius: 8px; font: 600 16px sans-serif; }
      /* Promotion is by WEIGHT, SIZE and BORDER, never by colour alone - the owner is
         red/green colourblind (CLAUDE.md house rule / memory owner-colorblind-...). */
      #eoa-preruntime-open.eoa-promoted { min-height: 56px; color: #17100a;
        background: #d9ad38; border: 2px solid #f4d16b; font: 700 18px sans-serif; }
      #eoa-preruntime-form { display: none; margin-top: 8px; padding: 10px;
        background: rgba(13, 10, 20, 0.94); border: 1px solid #4b3c6b; border-radius: 8px; }
      #eoa-preruntime-note { display: block; width: 100%; box-sizing: border-box;
        min-height: 72px; padding: 8px; color: #f4e5b5; background: #1a1424;
        border: 1px solid #6b5a2e; border-radius: 6px; font: 400 16px/1.35 sans-serif;
        touch-action: auto; -webkit-user-select: text; user-select: text; }
      #eoa-preruntime-send { margin-top: 8px; min-height: 56px; width: 100%;
        color: #17100a; background: #d9ad38; border: 2px solid #f4d16b; border-radius: 8px;
        font: 700 17px sans-serif; }
      #eoa-preruntime-status { margin-top: 6px; min-height: 18px;
        color: #d7c9f0; font: 600 14px/1.3 sans-serif; }
    </style>
  </head>
  <body>
    <div id="eoa-safe-probe"></div>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
      <div id="unity-loading-bar">Loading {{{ PRODUCT_NAME }}}...</div>
    </div>
    <div id="applixir-ad-container"></div>
    <div id="pi-landscape-gate" role="dialog" aria-modal="true" aria-label="Landscape required">
      <div>Echoes of Elarion plays in landscape.<br />Rotate your device, then enter landscape.</div>
      <button id="pi-landscape-button" type="button">ENTER LANDSCAPE</button>
      <small id="pi-landscape-status">If rotation is locked, enable Auto-rotate in device settings.</small>
      <button id="pi-landscape-continue" type="button">CONTINUE ANYWAY (SKIP ROTATION)</button>
    </div>
    <!-- WO-1927: the pre-runtime bug door. Every player-facing string below is the CANONICAL
         en value from Assets/Resources/Data/Canonical/en.json, with its key named in a comment
         so a future locale pass has the seam.
         ⚠ RECORDED GAP (CLAUDE.md §11B / memory localization_law_...): THIS TEMPLATE HAS NO
         LOCALE SEAM AT ALL - every string in it (the loading bar, the landscape gate) is a
         hardcoded en literal, because the page runs before the Unity locale tables are loaded
         and there is no page-side locale loader. So these are en literals too, deliberately
         sourced from en.json rather than invented. Wiring a page-side locale fetch is a
         separate ticket; it is NOT smuggled into this one.
         `hud.bug_report.log_notice` is deliberately NOT used: it promises "your player id",
         which does not exist before the runtime boots. -->
    <div id="eoa-preruntime-door">
      <!-- en.json hud.bug_report.title -->
      <button id="eoa-preruntime-open" type="button" aria-expanded="false">REPORT A BUG</button>
      <div id="eoa-preruntime-form">
        <!-- en.json hud.bug_report.note_placeholder -->
        <textarea id="eoa-preruntime-note" rows="3" maxlength="4000"
                  placeholder="What went wrong?" aria-label="What went wrong?"></textarea>
        <!-- en.json hud.bug_report.send -->
        <button id="eoa-preruntime-send" type="button">Send report</button>
        <div id="eoa-preruntime-status" role="status" aria-live="polite"></div>
      </div>
    </div>
    <script>
      // --- WO-678: own the global JS error surface --------------------------------------
      // pi-sdk.js loads in ANY browser and tracks host-channel requests by promise id with
      // an internal 120s timeout. Outside Pi Browser the host never answers, so Pi.init
      // spawns a promise that rejects ~120s later as a GLOBAL unhandledrejection
      // ("Promise with id 0 timed out after 120000 ms") - long after our C# 20s/30s
      // timeouts already settled. That class is expected/benign: suppress ONLY it, log one
      // quiet console.info, and forward it into Unity telemetry. Unknown errors ALWAYS
      // pass through (no blanket swallow - CLAUDE.md sec.5 no-silent-failure).
      var PI_BENIGN_SIGNATURES = [
        /promise with id \d+ timed out/i,          // the SDK's internal host-channel timeout
        /not (running )?in (the )?pi browser/i,    // the SDK's own not-in-Pi-Browser class
        /window\.Pi undefined/i                    // our bridge's not-in-Pi-Browser message
      ];
      function piIsBenign(msg) {
        if (!msg) return false;
        for (var i = 0; i < PI_BENIGN_SIGNATURES.length; i++) {
          if (PI_BENIGN_SIGNATURES[i].test(msg)) return true;
        }
        return false;
      }
      function piForwardToUnity(msg) {
        try {
          if (window.unityInstance) {
            window.unityInstance.SendMessage('PiBridge', 'OnPiCallback', JSON.stringify({
              type: 'error', paymentId: '',
              data: { where: 'sdk-global', message: '' + msg }
            }));
          }
        } catch (e) { /* Unity not ready - the console.info at the call site is the record */ }
      }
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = '' + ((reason && (reason.message || reason)) || '');
        if (piIsBenign(msg)) {
          event.preventDefault();
          console.info('[Pi] SDK host-channel timeout (expected outside Pi Browser) - suppressed: ' + msg);
          piForwardToUnity(msg);
        }
        // Anything else stays unhandled -> surfaces normally (never blanket-swallow).
      });
      window.onerror = function (message, source, lineno, colno, error) {
        var msg = '' + (message || (error && error.message) || '');
        if (piIsBenign(msg)) {
          console.info('[Pi] SDK error (expected outside Pi Browser) - suppressed: ' + msg);
          piForwardToUnity(msg);
          return true; // suppress ONLY the known-benign Pi class
        }
        return false; // unknown errors surface normally
      };
      // -----------------------------------------------------------------------------------

      // iOS Safari ignores CSS touch-action for PAGE pinch-zoom; block the page-level gesture so
      // two-finger input reaches Unity's build-mode camera instead of zooming the browser. The
      // canvas keeps its own touches (touch-action:none above); we only kill the page gesture.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (g) {
        document.addEventListener(g, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();  // multi-finger = game gesture, not page scroll
      }, { passive: false });

      // ===================================================================================
      // PROD-022 Lane A: get the [PiLifecycle] crumbs INTO THE DATABASE.
      // ===================================================================================
      // These crumbs are the ONLY signal that separates "the webview jettisoned the tab" from
      // "the app tore itself down" - and until now they were console.info ONLY. A grep of every
      // recorded Pi Browser session returned ZERO [PiLifecycle] lines while the published app
      // cold-booted every 30-60s, so the P0 could not be rooted. A diagnostic that never leaves
      // the device is not instrumentation (CLAUDE.md sec.12).
      //
      // They POST to the SAME sink the Unity client uses (WebTrace.cs -> /api/trace ->
      // analytics_events) in the SAME { sessionId, buildId, entries[] } shape, so they come back
      // out of the SAME reader: ?view=traces&session=<id>. Every line carries the [PiLifecycle]
      // prefix, so one grep finds them.
      //
      // THE BOOT LINE MUST POST BEFORE UNITY STARTS. Its whole value is describing a boot whose
      // PREDECESSOR died; by definition the interesting case is the one where the runtime never
      // got there, so it cannot depend on the runtime being alive.
      //
      // Content-Type is text/plain DELIBERATELY. text/plain is a CORS-safelisted request type, so
      // neither the fetch nor the sendBeacon needs a preflight OPTIONS round-trip - and
      // sendBeacon CANNOT preflight at all, so an application/json beacon would simply never be
      // sent. api/trace.js JSON.parses a string body and reads sessionId/buildId out of the body
      // (the X-Trace-* headers are optional there, and sendBeacon cannot set headers).
      var PI_TRACE_ENDPOINT = 'https://defenders-of-the-realm-v2.vercel.app/api/trace';
      var PI_TRACE_SCENE    = 'PiTemplate';
      // Mirrors WebTrace.MakeSessionId ("wt-" + hex) and MakeBuildId ("<version>@<host>") so these
      // rows attribute to a deployment exactly like the Unity ones. The "wt-pi" prefix marks a
      // session that the TEMPLATE opened, before/without any Unity runtime.
      //
      // THE TEMPLATE SESSION IS DELIBERATELY INDEPENDENT OF UNITY'S, AND IS NOT CORRELATED BY ID.
      // Unity mints its own session id inside the runtime, so the page cannot know it in advance;
      // the only way to learn it is to read the runtime's console announcement, which NEVER
      // ARRIVES in the exact failure being instrumented (Unity dying during load). A correlation
      // mechanism that fails precisely when it is needed is worse than none, and sniffing the
      // console would put a page-layer hook inside the runtime's hot path for the whole doomed
      // session (docs/ARCHITECTURE_PRINCIPLES.md: presentation never reaches into the objects).
      // Correlate by TIME instead: every crumb is timestamped and carries the same buildId, which
      // is how the PROD-022 diagnosis was built in the first place - and time correlation still
      // works when Unity never boots at all.
      var piTraceSession = 'wt-pi' + Math.random().toString(16).slice(2, 12);
      var piTraceBuild   = '{{{ PRODUCT_VERSION }}}';
      try {
        if (location && location.hostname) piTraceBuild += '@' + location.hostname;
      } catch (e) {
        console.info('[PiLifecycle] build host unavailable (trace rows carry the bare version): ' + e);
      }

      // Fire-and-forget one crumb at the trace sink. NEVER throws: this file owns the global JS
      // error surface (WO-678), and telemetry must not be able to stop a boot.
      function piTraceEmit(message, useBeacon) {
        try {
          var payload = JSON.stringify({
            sessionId: piTraceSession,
            buildId:   piTraceBuild,
            entries: [{
              utcMs:   Date.now(),
              kind:    'log',
              tag:     'PiLifecycle',
              message: '' + message,
              scene:   PI_TRACE_SCENE
            }]
          });
          // pagehide/hidden are TEARDOWN events: a normal fetch is cancelled together with the
          // document, so sendBeacon - which the browser queues and delivers after the page is
          // gone - is the only transport that actually lands. keepalive fetch is the fallback
          // for a browser without sendBeacon.
          if (useBeacon && navigator.sendBeacon) {
            var blob = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
            if (navigator.sendBeacon(PI_TRACE_ENDPOINT, blob)) return;
            console.info('[PiLifecycle] sendBeacon refused the crumb - falling back to keepalive fetch');
          }
          fetch(PI_TRACE_ENDPOINT, {
            method: 'POST',
            body: payload,
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            keepalive: true,
            mode: 'cors',
            credentials: 'omit'
          })['catch'](function (e) {
            console.info('[PiLifecycle] crumb POST failed (fire-and-forget, dropped): ' + e);
          });
        } catch (e) {
          console.info('[PiLifecycle] crumb emit skipped: ' + e);
        }
      }

      // --- Boot breadcrumbs: DIAGNOSTIC ONLY, and they must NEVER be able to stop the boot ------
      // A browser with site data blocked (Pi Browser can be configured this way, as can any
      // private/hardened mode) THROWS on the mere ACCESS of window.localStorage. This file owns
      // the global JS error surface (WO-678), so an unguarded throw at module scope meant Unity
      // never started and the player saw a blank page. Every read and write goes through these
      // two helpers, and both swallow-with-a-log (console.info is the record - CLAUDE.md sec.12
      // no-silent-failure) rather than propagate.
      function piBootCrumb(phase) {
        try {
          window.localStorage.setItem('eoa.pi.boot', JSON.stringify({ id: bootId, phase: phase, at: Date.now() }));
        } catch (e) {
          console.info('[PiLifecycle] breadcrumb write unavailable (storage blocked) phase=' + phase + ': ' + e);
        }
      }
      function piReadBootCrumb() {
        try {
          return window.localStorage.getItem('eoa.pi.boot');
        } catch (e) {
          // Forwarded: a blocked read means `previous=` is permanently null, which would
          // otherwise read in the trace as "the last boot left no crumb" - the opposite
          // conclusion. It fires once, at boot, never during teardown.
          var line = '[PiLifecycle] breadcrumb read unavailable (storage blocked): ' + e;
          console.info(line);
          piTraceEmit(line, false);
          return null;
        }
      }

      // ===================================================================================
      // WO-1927: A PRE-RUNTIME BUG DOOR. The in-game feedback UI lives INSIDE the Unity
      // runtime, so on a device where the runtime never starts the player has no channel at
      // all - which is exactly the iPhone case behind WO-1925 (11 sessions, every one a
      // web_trace row, not one session_start, and NO bug_reports row from iOS ever).
      // ===================================================================================
      // It POSTs to the EXISTING /api/bug-report (api/bug-report.js), in the shape that file
      // already normalizes at :67-99 - no second endpoint, no second table (PROD-017's lesson).
      //   note      -> description        sceneName -> route        version -> app_version
      //   sessionId + platform + traceTail -> the context jsonb
      // THE JOIN KEY IS `sessionId = piTraceSession`. api/trace.js writes every template crumb
      // to analytics_events with player_id = that same session id (trace.js:129-135), so a
      // report and its trace rows join on one exact string. bootId rides in traceTail as well,
      // because it is what the [PiLifecycle] message text carries.
      // Content-Type is text/plain for the same reason the crumbs are (CORS-safelisted, no
      // preflight); api/bug-report.js:58 JSON.parses a string body, so no API change is needed.
      var PI_BUG_REPORT_ENDPOINT = 'https://defenders-of-the-realm-v2.vercel.app/api/bug-report';
      // The loader legitimately pauses on a ~150MB data ramp, so a stall is not a failure and
      // the door is ALREADY VISIBLE either way - promotion is emphasis, not a new door. 20s with
      // no progress callback at all is well past any normal decompression pause.
      var PI_DOOR_STALL_MS = 20000;
      var piDoorEl     = document.querySelector('#eoa-preruntime-door');
      var piDoorOpen   = document.querySelector('#eoa-preruntime-open');
      var piDoorForm   = document.querySelector('#eoa-preruntime-form');
      var piDoorNote   = document.querySelector('#eoa-preruntime-note');
      var piDoorSend   = document.querySelector('#eoa-preruntime-send');
      var piDoorStatus = document.querySelector('#eoa-preruntime-status');
      var piDoorStallTimer = null;
      var piDoorSent = false;

      function piDoorPromote(reason) {
        try {
          if (!piDoorOpen || !piDoorEl) return;
          if (piDoorOpen.className.indexOf('eoa-promoted') >= 0) return;
          piDoorOpen.className = 'eoa-promoted';
          console.info('[PiLifecycle] bug-door promoted reason=' + reason);
        } catch (e) { console.info('[PiLifecycle] bug-door promote skipped: ' + e); }
      }
      function piDoorHide() {
        // The runtime is up and owns its own feedback UI - a stray HTML form parked over the
        // canvas would be the wrong outcome (WO-1927 §4: this is an ADDITIONAL door).
        try {
          if (piDoorStallTimer !== null) { window.clearTimeout(piDoorStallTimer); piDoorStallTimer = null; }
          if (piDoorEl) piDoorEl.style.display = 'none';
        } catch (e) { console.info('[PiLifecycle] bug-door hide skipped: ' + e); }
      }
      function piDoorNoteProgress() {
        // Re-armed on EVERY progress callback: the timer measures "no progress for N ms",
        // never "N ms since boot" (a slow-but-healthy download must not be called a stall).
        try {
          if (piDoorStallTimer !== null) window.clearTimeout(piDoorStallTimer);
          piDoorStallTimer = window.setTimeout(function () {
            piDoorPromote('stall pct=' + (window.__piLastPct || 0));
          }, PI_DOOR_STALL_MS);
        } catch (e) { console.info('[PiLifecycle] bug-door stall timer skipped: ' + e); }
      }

      function piDoorSubmit() {
        // EVERY failure here is logged and swallowed. A broken feedback door must never break a
        // boot that might still succeed (WO-1927 §2, and CLAUDE.md §12: logged, never silent).
        try {
          if (piDoorSent) return;
          var note = (piDoorNote && piDoorNote.value) ? String(piDoorNote.value) : '';
          var pm = null;
          try { pm = (performance && performance.memory) ? performance.memory : null; } catch (e) { pm = null; }
          // traceTail is the diagnostic context, one fact per line, and it is ALSO what keeps a
          // note-less report out of api/bug-report.js:97's "Empty report" 400 - the capture is
          // the value even when the player types nothing.
          var tail = [
            'boot=' + bootId,
            'session=' + piTraceSession,
            'pct=' + (window.__piLastPct || 0),
            'upMs=' + (Date.now() - piBootAt),
            'navigation=' + piNavType,
            'ua=' + (navigator.userAgent || ''),
            'deviceMemoryGB=' + (navigator.deviceMemory || '?'),
            'jsHeapLimitMB=' + (pm ? Math.round(pm.jsHeapSizeLimit / 1048576) : '?'),
            'inner=' + window.innerWidth + 'x' + window.innerHeight,
            'dpr=' + (window.devicePixelRatio || '?'),
            'unityStarted=' + (!!window.unityInstance)
          ];
          var payload = JSON.stringify({
            note: note,
            sceneName: PI_TRACE_SCENE,       // 'PiTemplate' - there is no Unity scene yet
            version: piTraceBuild,           // identical to the web_trace rows' buildId
            platform: 'webgl-preruntime',
            sessionId: piTraceSession,       // THE JOIN KEY (analytics_events.player_id)
            traceTail: tail
          });
          piDoorSent = true;
          if (piDoorSend) piDoorSend.disabled = true;
          // en.json feedback.sending
          if (piDoorStatus) piDoorStatus.textContent = 'Sending...';

              bubbles: true, cancelable: e.cancelable, composed: true,
              touches: piMapTouches(e.touches),                // ALL points, never touches[0]
              targetTouches: piMapTouches(target),
              changedTouches: piMapTouches(e.changedTouches),
              ctrlKey: e.ctrlKey, altKey: e.altKey, shiftKey: e.shiftKey, metaKey: e.metaKey
            });
          } else {
            var mu = e.clientY;
            var mv = piRotW - e.clientX;
            var init = {
              bubbles: true, cancelable: e.cancelable, composed: true, view: window,
              detail: e.detail, clientX: mu, clientY: mv, screenX: mu, screenY: mv,
              button: e.button, buttons: e.buttons,
              ctrlKey: e.ctrlKey, altKey: e.altKey, shiftKey: e.shiftKey, metaKey: e.metaKey
            };
            if (piSynthPointerOk && typeof e.pointerId === 'number') {
              init.pointerId = e.pointerId;
              init.pointerType = e.pointerType;
              init.isPrimary = e.isPrimary;
              init.pressure = e.pressure;
              init.width = e.height;   // the contact box rotates with the surface
              init.height = e.width;
              synth = new window.PointerEvent(e.type, init);
            } else {
              synth = new window.MouseEvent(e.type, init);
            }
          }
        } catch (err) {
          // Could not rebuild it: let the ORIGINAL through (wrong coords) rather than drop the
          // input entirely, and say so loudly - CLAUDE.md sec.12, no silent failures.
          console.warn('[PiOrientation] shim could not rebuild ' + e.type + ': ' + err);
          return;
        }
        e.stopImmediatePropagation();
        synth.piShim = true;
        piCanvas.dispatchEvent(synth);
      }
      function piEachShimType(fn) {
        PI_SHIM_TOUCH.forEach(fn);
        PI_SHIM_MOUSE.forEach(fn);
        if (piSynthPointerOk) PI_SHIM_POINTER.forEach(fn);
      }
      function piAddShim() {
        piEachShimType(function (t) {
          window.addEventListener(t, piShimHandler, { capture: true, passive: false });
        });
      }
      function piRemoveShim() {
        piEachShimType(function (t) {
          window.removeEventListener(t, piShimHandler, { capture: true });
        });
      }
      function piActivateRotation() {
        // Dimensions are refreshed on EVERY call (the URL bar hiding fires a resize).
        piRotW = window.innerWidth;
        piRotH = window.innerHeight;
        piContainer.style.width = piRotH + 'px';
        piContainer.style.height = piRotW + 'px';
        // WO-1906: the rotated surface OWNS the whole box, origin included. eoaApplyFit() runs once
        // before this (synchronously at boot) and writes inline left/top in px; with
        // viewport-fit=cover a cutout inset would make those non-zero, and the input shim's
        // u=clientY / v=piRotW-clientX maths assumes the surface origin is exactly (0,0). Reset
        // them here so a wrong tap can never come from a stale fit offset.
        piContainer.style.left = '0px';
        piContainer.style.top = '0px';
        if (piRotationActive) return;
        piRotationActive = true;
        piContainer.classList.add('pi-rotated');
        piCanvas.getBoundingClientRect = piLogicalRect;
        piAddShim();
        console.info('[PiOrientation] rotated surface ON ' + piRotH + 'x' + piRotW + ' boot=' + bootId);
      }
      function piDeactivateRotation() {
        if (!piRotationActive) return;
        piRotationActive = false;
        piContainer.classList.remove('pi-rotated');
        piContainer.style.width = '';
        piContainer.style.height = '';
        try {
          delete piCanvas.getBoundingClientRect;   // restore the prototype implementation
        } catch (err) {
          piCanvas.getBoundingClientRect = Element.prototype.getBoundingClientRect;
        }
        piRemoveShim();
        console.info('[PiOrientation] rotated surface OFF boot=' + bootId);
      }

      async function requestLandscape() {
        // Legacy path only (see piApplyOrientation): reachable when the browser cannot
        // synthesize touch events, so the rotated surface is unsafe to use.
        var status = document.querySelector('#pi-landscape-status');
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen)
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          if (screen.orientation && screen.orientation.lock)
            await screen.orientation.lock('landscape');
        } catch (e) {
          console.warn('[PiOrientation] landscape request rejected: ' + e);
          status.textContent = 'Pi Browser refused rotation. Enable Auto-rotate, rotate the device, then tap again.';
        }
        piApplyOrientation();
      }
      document.querySelector('#pi-landscape-button').addEventListener('click', requestLandscape);
      document.querySelector('#pi-landscape-continue').addEventListener('click', function () {
        console.info('[PiOrientation] escape hatch taken - booting without a landscape report boot=' + bootId);
        piBootCrumb('landscape-escape');
        startUnityOnce();
      });

      // The single orientation decision, evaluated at boot and on every orientation/size event.
      function piApplyOrientation() {
        if (!piBrowser) {                       // non-Pi browsers: unchanged, straight to Unity
          if (!unityStarted) startUnityOnce();
          return;
        }
        if (isLandscape()) {                    // a genuinely landscape viewport takes the old path
          piDeactivateRotation();
          if (!unityStarted) startUnityOnce();
          return;
        }
        if (!piRotationAvailable) {             // fallback: no working shim, so do NOT rotate
          if (!unityStarted) showLandscapeGate();
          return;
        }
        piActivateRotation();
        if (!unityStarted) startUnityOnce();
      }
      function recheckLandscape() { piApplyOrientation(); }
      window.addEventListener('orientationchange', recheckLandscape);
      window.addEventListener('resize', recheckLandscape);
      window.addEventListener('pageshow', function (e) {
        // PROD-022: persisted IS the discriminator, and it is the one crumb the 2026-09-02 triage
        // was missing. Five post-deploy sessions showed previous.phase='unity-running' with
        // navigation='navigate'/'back_forward' and NO pagehide crumb anywhere - which matches no row
        // of the WO's diagnostic table. persisted=true means this document came back from the
        // bfcache (Pi Browser navigated away and returned; the process lived). persisted=false on a
        // back_forward means the document was REBUILT - i.e. the content process was killed while it
        // was in the back/forward list. That distinction is not derivable from any other line we
        // capture, which is why console.info alone left the root unproven.
        var line = '[PiLifecycle] pageshow boot=' + bootId + ' persisted=' + !!e.persisted +
                   ' navigation=' + piNavType;
        console.info(line);
        // NOT a beacon: pageshow is a restore, not a teardown, so an ordinary fetch survives and
        // keeps this off the beacon queue that pagehide/hidden depend on.
        piTraceEmit(line, false);
        recheckLandscape();
      });
      window.addEventListener('pagehide', function (e) {
        var line = '[PiLifecycle] pagehide boot=' + bootId + ' persisted=' + !!e.persisted;
        console.info(line);
        piBootCrumb('pagehide');
        piTraceEmit(line, true);   // beacon: a plain fetch does not survive teardown
      });
      window.addEventListener('beforeunload', function (e) {
        // WO-1324: Final flush on unload. beforeunload is the last event before the page dies
        // (before pagehide on some browsers). Fire a beacon with a final-flush marker so we can
        // measure how many buffered entries exist at the moment of death.
        var line = '[WebTrace] final-flush-on-unload boot=' + bootId + ' upMs=' + (Date.now() - piBootAt);
        console.info(line);
        piTraceEmit(line, true);   // beacon: must survive unload
      });
      document.addEventListener('visibilitychange', function () {
        var line = '[PiLifecycle] visibility boot=' + bootId + ' state=' + document.visibilityState;
        console.info(line);
        // 'hidden' is the last event some webviews deliver before jettisoning the tab, so that
        // one goes out by beacon too - a fetch issued here can be cancelled with the document.
        piTraceEmit(line, document.visibilityState === 'hidden');
        if (document.visibilityState === 'visible') recheckLandscape();
      });
      // ===================================================================================
      // WO-1906: FIT THE CANVAS TO THE VISUAL VIEWPORT. Every host, no UA gate.
      // ===================================================================================
      // Owner ruling (WO-1906:31, verbatim): "the game must display on all devices, not at a locked
      // percentage, if user goes to itch from a ipad should play in browser, if itch from phone
      // should fit browser, if PC chrome, should play in browser".
      //
      // WHY 100%/100% CSS IS NOT ENOUGH, even though it is not a "locked percentage":
      //   * `100%` resolves against the LAYOUT viewport. iOS Safari's layout viewport does not
      //     shrink when the address/tab bars are showing, and it does not track a pinch-zoomed
      //     visual viewport at all - so the box can legitimately be taller/wider than the pixels
      //     the player can see, and the HUD edges sit off-screen with nothing to scroll to.
      //   * Inside an iframe (itch serves the game from html-classic.itch.zone inside a frame the
      //     PARENT page sizes - measured at a fixed 1940x1100 for this project, WO-1906 "itch embed
      //     measured"), `100%` faithfully fills a frame that is itself wider than the phone. The
      //     frame size is set outside this document and CANNOT be fixed from in here; this block is
      //     the belt-and-suspenders half, the itch project-page embed setting is the other half.
      // So we size the container in PX from window.visualViewport (fallback window.innerWidth/
      // innerHeight), on every resize/scroll/orientation event, and re-assert it.
      //
      // NO LETTERBOX, DELIBERATELY. There is no aspect handling in this template to preserve (the
      // canvas has always been 100%/100%; aspect is the Unity runtime's business), and pillarboxing
      // to 16:9 on a portrait tablet would produce a thin strip - the same unreachable-HUD failure
      // the owner reported, arrived at from the other direction. The canvas FILLS the visible box.
      //
      // SAFE AREA: subtracted, not ignored. With viewport-fit=cover the visual viewport extends
      // under the notch and the home indicator, so a canvas that filled it exactly would hide HUD
      // under system chrome. env() is CSS-only, so #eoa-safe-probe parks the four insets on a
      // zero-size element's padding and we read them back.
      //
      // ROTATION: gated on STATE, never on the UA. piActivateRotation() owns the container box on
      // the Pi Browser rotated surface (it sets width/height in px itself, and the input shim's
      // coordinate maths is derived from exactly those numbers); a second writer there would break
      // input invisibly. `piRotationActive` is that state.
      var EOA_FIT_MIN_PX = 64;          // never hand the runtime a degenerate box
      var eoaFitLastStamp = '';
      var eoaFitLogged = 0;
      function eoaSafeInsets() {
        try {
          var probe = document.querySelector('#eoa-safe-probe');
          if (!probe) return { l: 0, r: 0, t: 0, b: 0 };
          var cs = window.getComputedStyle(probe);
          var n = function (v) { var f = parseFloat(v); return (isFinite(f) && f > 0) ? f : 0; };
          return { l: n(cs.paddingLeft), r: n(cs.paddingRight), t: n(cs.paddingTop), b: n(cs.paddingBottom) };
        } catch (e) {
          console.info('[EoaFit] safe-area probe unreadable (treating insets as 0): ' + e);
          return { l: 0, r: 0, t: 0, b: 0 };
        }
      }
      function eoaVisualViewport() {
        var vv = window.visualViewport;
        if (vv && vv.width > 0 && vv.height > 0) {
          return { w: vv.width, h: vv.height, ox: vv.offsetLeft || 0, oy: vv.offsetTop || 0, src: 'vv' };
        }
        // Fallback for any host without the API (older WebViews). innerWidth/innerHeight are the
        // closest equivalent and are never 0 on a live document.
        return { w: window.innerWidth, h: window.innerHeight, ox: 0, oy: 0, src: 'inner' };
      }
      function eoaApplyFit(reason) {
        try {
          if (typeof piRotationActive !== 'undefined' && piRotationActive) return;  // rotated surface owns the box
          var container = document.querySelector('#unity-container');
          var canvas = document.querySelector('#unity-canvas');
          if (!container || !canvas) return;
          var v = eoaVisualViewport();
          var ins = eoaSafeInsets();
          var w = Math.round(v.w - ins.l - ins.r);
          var h = Math.round(v.h - ins.t - ins.b);
          // A pathological inset (or a mid-rotation measurement) must never shrink the game to
          // nothing - fall back to the raw viewport and say so rather than ship a sliver.
          if (w < EOA_FIT_MIN_PX || h < EOA_FIT_MIN_PX) {
            console.info('[EoaFit] safe-area insets rejected (would leave ' + w + 'x' + h + ') - using raw viewport');
            w = Math.round(v.w); h = Math.round(v.h); ins = { l: 0, r: 0, t: 0, b: 0 };
          }
          w = Math.max(EOA_FIT_MIN_PX, w); h = Math.max(EOA_FIT_MIN_PX, h);
          container.style.position = 'fixed';
          container.style.left = Math.round(v.ox + ins.l) + 'px';
          container.style.top = Math.round(v.oy + ins.t) + 'px';
          container.style.width = w + 'px';
          container.style.height = h + 'px';
          canvas.style.width = '100%';
          canvas.style.height = '100%';
          // The page itself must never scroll: a scrollable page is how the game ends up partly
          // off-screen with the HUD parked in an area the player has to find by dragging.
          document.documentElement.style.overflow = 'hidden';
          document.body.style.overflow = 'hidden';
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          // The DETERMINISTIC SEAM the proof tool waits on (tools/web-canvas-fit.mjs). It is a data
          // attribute, not a log line, because the tool must be able to read the applied result
          // without the 165MB runtime having booted.
          var stamp = w + 'x' + h + '@' + dpr + ':' + v.src;
          canvas.setAttribute('data-eoa-fit', stamp);
          if (stamp !== eoaFitLastStamp) {
            eoaFitLastStamp = stamp;
            var line = '[EoaFit] fit ' + stamp + ' reason=' + reason +
              ' inner=' + window.innerWidth + 'x' + window.innerHeight +
              ' safe=' + ins.l + ',' + ins.t + ',' + ins.r + ',' + ins.b;
            console.info(line);
            // Throttled: the first four distinct sizes are the boot + first rotation, which is all
            // a reader needs. An unthrottled resize firehose would evict the boot window from the
            // trace (CLAUDE.md 12).
            if (eoaFitLogged < 4) { eoaFitLogged++; piTraceEmit('[PiLifecycle] ' + line, false); }
          }
        } catch (e) {
          // Reported, never silent (CLAUDE.md 12) - and never fatal: a fit failure must not stop a boot.
          console.info('[EoaFit] fit skipped: ' + e);
        }
      }
      window.addEventListener('resize', function () { eoaApplyFit('resize'); });
      window.addEventListener('orientationchange', function () {
        eoaApplyFit('orientationchange');
        // iOS reports the OLD viewport inside the orientationchange handler; re-measure after the
        // browser has settled the new one.
        window.setTimeout(function () { eoaApplyFit('orientationchange-settle'); }, 300);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { eoaApplyFit('vv-resize'); });
        window.visualViewport.addEventListener('scroll', function () { eoaApplyFit('vv-scroll'); });
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') eoaApplyFit('visible');
      });
      // SYNCHRONOUS, BEFORE piApplyOrientation() appends the loader: the runtime reads the canvas
      // client size during startup, so the box has to be right before that first read, not after.
      eoaApplyFit('boot');

      piApplyOrientation();
    </script>
  </body>
</html>
